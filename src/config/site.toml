[config.home.intro]
title = "oelbaytam"
name = "oelbaytam"
body = [
  "Thanks for visiting my site! I plan on using the blog as a diary for my thoughts, Projects ",
  """My name is Omar El-Baytam and I am a recent graduate
     from Wilfrid Laurier University's Computer Science program.
     At University I learned lots about computers but one class,
     Physical Computing, stuck with me more than my others.
     This class taught me how computers sense data in the real
     world and how they communicate. This inspired my intrest
     in Microcontrollers, IoT, and Electronics of all kinds.""",
  """In pursuit of more Embedded Development knowledge I am
     constantly working on improving my skills in C/C++ and
     writing the occasional backend in Python. At the moment
     I am tinkering with ESP-IDF Framework and FreeRTOS.""",
]
image = "/images/logo-cat.png"

